version: "3.8"

services:
  waymore-ai-worker:
    image: icwlee/waymore-ai:v1
    shm_size: 2G
    env_file:
      - .env
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      PYTHONPATH: /workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:80"
    working_dir: /workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3